<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg', v=2) }}">
    <title>Customer Directory | DashDesk</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/customer.css') }}">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">DashDesk
        </div>
        <nav class="nav-links">
            <a href="{{ url_for('admin_dashboard') }}" class="nav-item"><i class="fas fa-chart-pie"></i> <span>Dashboard</span></a>
            <a href="{{ url_for('admin_activechats') }}" class="nav-item"><i class="fas fa-comment-dots"></i> <span>Active Chats</span></a>
            <a href="{{ url_for('admin_booking') }}" class="nav-item"><i class="fas fa-calendar-check"></i> <span>Bookings</span></a>
            <a href="{{ url_for('admin_customer') }}" class="nav-item active"><i class="fas fa-users"></i> <span>Customers</span></a>
            <a href="{{ url_for('admin_venues') }}" class="nav-item"><i class="fas fa-image"></i> <span>Venues</span></a>
        </nav>
    </aside>

    <div class="container">
        <header class="page-header">
            <h2>Customers</h2>
            <input type="text" id="custSearch" placeholder="Search customers..." class="search-input">
        </header>

        <div class="customer-grid" id="custGrid">
            <div class="customer-card">Loading customers...</div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.nav-item').forEach(item => {
            const href = item.getAttribute('href');
            if (window.location.pathname.endsWith(href)) {
                item.classList.add('active');
            }
        });

        const adminActiveChatsUrl = "{{ url_for('admin_activechats') }}";
        const adminBookingUrl = "{{ url_for('admin_booking') }}";

        const formatDate = (isoDate) => {
            if (!isoDate) return 'No bookings yet';
            const value = new Date(isoDate);
            if (Number.isNaN(value.getTime())) return isoDate;
            return value.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        };

        const formatCurrency = (value) => `₱ ${Number(value || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

        const renderCustomers = (customers) => {
            const grid = document.getElementById('custGrid');
            if (!customers.length) {
                grid.innerHTML = '<div class="customer-card">No customers found.</div>';
                return;
            }

            grid.innerHTML = customers.map((customer) => {
                const badge = customer.booking_count >= 3 || customer.total_spend >= 10000 ? 'VIP' : 'Member';
                const latestBooking = customer.latest_booking;
                return `
                    <div class="customer-card">
                        <span class="vip-badge">${badge}</span>
                        <div class="customer-head">
                            <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(customer.full_name || customer.email || 'Customer')}&background=111111&color=fff" class="profile-img" alt="${customer.full_name || customer.email || 'Customer'}">
                            <div>
                                <h3 class="customer-name">${customer.full_name || 'Unnamed Customer'}</h3>
                                <span>${customer.email || '-'}</span>
                            </div>
                        </div>
                        <p style="margin: 0 0 0.6rem; color: var(--text-muted); font-size: 0.9rem;">${customer.booking_count || 0} bookings · ${formatCurrency(customer.total_spend || 0)}</p>
                        <p style="margin: 0 0 1rem; color: var(--text-muted); font-size: 0.86rem;">Last booking: ${latestBooking ? formatDate(latestBooking.date) : 'No bookings yet'}</p>
                        <div class="customer-actions">
                            <a class="btn-outline" href="${adminActiveChatsUrl}?customer_email=${encodeURIComponent(customer.email || '')}"><i class="fas fa-comment"></i> Message</a>
                            <a class="btn-outline" href="${adminBookingUrl}?customer_email=${encodeURIComponent(customer.email || '')}"><i class="fas fa-history"></i> History</a>
                        </div>
                    </div>
                `;
            }).join('');
        };

        const loadCustomers = async () => {
            try {
                const response = await fetch('/api/admin/customers');
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.message || 'Failed to load customers.');
                }
                renderCustomers(data.customers || []);
            } catch (error) {
                document.getElementById('custGrid').innerHTML = `<div class="customer-card">${error.message || 'Failed to load customers.'}</div>`;
            }
        };

        loadCustomers();

        document.getElementById('custSearch').onkeyup = function() {
            let term = this.value.toLowerCase();
            document.querySelectorAll('.customer-card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(term) ? 'block' : 'none';
            });
        };
    </script>
</body>
</html>
