<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Dashboard | DashDesk</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">DashDesk</div>
        <nav class="nav-links">
            <a href="{{ url_for('admin_dashboard') }}" class="nav-item active"><i class="fas fa-chart-pie"></i> <span>Dashboard</span></a>
            <a href="{{ url_for('admin_activechats') }}" class="nav-item"><i class="fas fa-comment-dots"></i> <span>Active Chats</span></a>
            <a href="{{ url_for('admin_booking') }}" class="nav-item"><i class="fas fa-calendar-check"></i> <span>Bookings</span></a>
            <a href="{{ url_for('admin_customer') }}" class="nav-item"><i class="fas fa-users"></i> <span>Customers</span></a>
            <a href="{{ url_for('admin_venues') }}" class="nav-item"><i class="fas fa-image"></i> <span>Venues</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <header>
            <div>
                <h2 class="section-title">Dashboard</h2>
                <p class="header-subtitle"><strong class="text-primary" id="dashboard-active-chats-count">0</strong> active chats.</p>
            </div>
            <div class="user-profile">
                <img src="https://ui-avatars.com/api/?name=Admin&background=111111&color=fff" class="user-avatar" alt="Admin avatar">
                <span class="user-name">Admin</span>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Active Chats</h3>
                <div class="value" id="dashboard-active-chats">0</div>
                <div class="stat-change stat-up"><i class="fas fa-comment-dots"></i> live threads</div>
            </div>
            <div class="stat-card">
                <h3>Bookings</h3>
                <div class="value" id="dashboard-bookings">0</div>
                <div class="stat-change stat-down"><i class="fas fa-calendar-check"></i> saved bookings</div>
            </div>
            <div class="stat-card">
                <h3>Revenue</h3>
                <div class="value" id="dashboard-revenue">₱ 0.00</div>
                <div class="stat-change stat-primary"><i class="fas fa-coins"></i> booking totals</div>
            </div>
        </div>

        <div class="content-card">
            <h3>Recent Bookings</h3>
            <table>
                <thead>
                    <tr><th>Customer</th><th>Package</th><th>Date</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody id="dashboard-bookings-body">
                    <tr>
                        <td colspan="5">Loading live booking data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <script>
        // Shared Navigation Script
        document.querySelectorAll('.nav-item').forEach(item => {
            const href = item.getAttribute('href');
            if (window.location.pathname.endsWith(href)) {
                item.classList.add('active');
            }
        });

        const formatDate = (isoDate) => {
            if (!isoDate) return '-';
            const value = new Date(`${isoDate}T00:00:00`);
            if (Number.isNaN(value.getTime())) return isoDate;
            return value.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        };

        const formatCurrency = (value) => `₱ ${Number(value || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

        const statusClassFor = (status) => {
            const normalized = String(status || '').toLowerCase();
            if (normalized === 'upcoming') return 'status-online';
            if (normalized === 'cancelled') return 'status-busy';
            return 'status-online';
        };

        const loadDashboard = async () => {
            try {
                const response = await fetch('/api/admin/dashboard-summary');
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.message || 'Failed to load dashboard data.');
                }

                const summary = data.summary || {};
                document.getElementById('dashboard-active-chats-count').textContent = summary.active_chats || 0;
                document.getElementById('dashboard-active-chats').textContent = summary.active_chats || 0;
                document.getElementById('dashboard-bookings').textContent = summary.bookings || 0;
                document.getElementById('dashboard-revenue').textContent = formatCurrency(summary.revenue || 0);

                const tbody = document.getElementById('dashboard-bookings-body');
                const recentBookings = Array.isArray(summary.recent_bookings) ? summary.recent_bookings : [];
                if (!recentBookings.length) {
                    tbody.innerHTML = '<tr><td colspan="5">No bookings found yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = recentBookings.map((booking) => `
                    <tr>
                        <td><strong>${booking.customer_name || booking.user_email || '-'}</strong><br><small>${booking.customer_email || booking.user_email || ''}</small></td>
                        <td>${booking.venue_package?.name || '-'}</td>
                        <td>${formatDate(booking.date)}</td>
                        <td><span class="status ${statusClassFor(booking.status)}">${String(booking.status || 'upcoming').charAt(0).toUpperCase() + String(booking.status || 'upcoming').slice(1)}</span></td>
                        <td><a href="{{ url_for('admin_booking') }}" class="action-link">Review</a></td>
                    </tr>
                `).join('');
            } catch (error) {
                const tbody = document.getElementById('dashboard-bookings-body');
                tbody.innerHTML = `<tr><td colspan="5">${error.message || 'Failed to load dashboard data.'}</td></tr>`;
            }
        };

        loadDashboard();
    </script>
</body>
</html>
